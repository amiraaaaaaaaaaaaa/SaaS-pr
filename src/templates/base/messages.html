{% if messages %}
<div class="max-w-screen-xl mx-auto px-4 mt-24 -mb-16 relative z-50 space-y-2">
    {% for message in messages %}
        <div class="p-4 text-sm rounded-lg flex items-center justify-between {% if message.tags == 'error' %}text-red-800 bg-red-50 border border-red-200{% else %}text-green-800 bg-green-50 border border-green-200{% endif %}" role="alert">
            <div class="flex items-center">
                <span class="font-medium">
                    {% if message.tags == 'error' %}Alert:{% else %}Success:{% endif %}
                </span>
                <span class="ml-2">{{ message }}</span>
            </div>
        </div>
    {% endfor %}
</div>
{% endif %}
