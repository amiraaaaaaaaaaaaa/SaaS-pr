{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-24 p-6 bg-white rounded-lg shadow-md border border-gray-200">
    <h2 class="text-2xl font-bold text-gray-900 mb-6 text-center">Login</h2>

    <!-- Submits directly to the current URL -->
    <form method="POST" class="space-y-4">
        {% csrf_token %}

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Username or email</label>
            <!-- FIXED: name changed to "login" -->
            <input type="text"
                   name="login"
                   placeholder="Write your email or username"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-black" />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password"
                   name="password"
                   placeholder="Your Password"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-black" />
        </div>

        <button type="submit"
                class="w-full px-4 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-md transition duration-200">
            Login
        </button>
    </form>
</div>
{% endblock content %}
