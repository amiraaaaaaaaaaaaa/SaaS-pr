{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-24 p-6 bg-white rounded-lg shadow-md border border-gray-200">
    <h2 class="text-2xl font-bold text-gray-900 mb-6 text-center">Register</h2>

    <!-- FIXED: Removed action="/register/" so it posts to the correct URL -->
    <form method="POST" class="space-y-4">
        {% csrf_token %}

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
            <input type="text"
                   name="username"
                   placeholder="Pick your username"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-black" />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email"
                   name="email"
                   placeholder="Your Email"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-black" />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <!-- FIXED: name changed to "password1" -->
            <input type="password"
                   name="password1"
                   placeholder="Your Password"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-black" />
        </div>

        <!-- FIXED: Added required Password Confirmation field -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
            <input type="password"
                   name="password2"
                   placeholder="Type Password Again"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-black" />
        </div>

        <button type="submit"
                class="w-full px-4 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-md transition duration-200">
            Register
        </button>
    </form>
</div>
{% endblock content %}
